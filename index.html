        `<td class="c group-sep">${totalAvgWk > 0 ? (totalAvgWk % 1 === 0 ? totalAvgWk : totalAvgWk.toFixed(1)) : '<span class="inv-cell-zero">0</span>'}</td>` +
        // OTHER — Store Options is per-size only (not accurate at the style
        // level), so the parent row leaves this blank. See the size rows below.
        `<td class="c"><span class="inv-cell-zero">—</span></td>` +
      `</tr>`;

    // ── Expanded: per-size detail rows ──
    // Last Restock Date is now in the main row; size name shows without "Size" prefix.
    if (isExpanded && Array.isArray(p.sizes)) {
      p.sizes.forEach(sz => {
        const szOh      = sz.oh || 0;
        const szTransit = sz.inTransit || 0;
        const szL30     = sz.l30 || 0;
        const szL60     = sz.l60 || 0;
        const szAvgWk   = sz.avgWeeklySales || 0;
        const szWhAvail = sz.warehouseAvailable;
        const szOnOrder = sz.onOrder;
        const szEta     = invFmtEta(sz.eta);
        // Per-size OH cell color:
        //   • orange if size is Low Inventory (OH < avg weekly sales, with sales > 0)
        //   • green  if OH > 0 (healthy stock)
        //   • red    if OH === 0 (out of stock for this size)
        const szIsLow   = invIsSizeLow(sz);
        const szOhCls   = szIsLow ? 'inv-cell-low' : (szOh > 0 ? 'inv-cell-good' : 'inv-cell-bad');
        const szL30Cls  = szL30 > 0 ? 'inv-cell-good' : 'inv-cell-bad';
        const szL60Cls  = szL60 > 0 ? 'inv-cell-good' : 'inv-cell-bad';

        html +=
          `<tr class="inv-size-row">` +
            `<td class="frozen-col frozen-col-1" style="background:#fafafa"></td>` +
            `<td class="frozen-col frozen-col-2 l" style="background:#fafafa;padding-left:36px;font-weight:600">${escapeHtml(String(sz.size || ''))}</td>` +
            // STORE
            `<td class="c"><span class="${szOhCls}">${szOh}</span></td>` +
            `<td class="c">${szTransit > 0 ? `<span class="inv-cell-good">${szTransit}</span>` : '<span class="inv-cell-zero">0</span>'}</td>` +
            `<td class="c"><span class="inv-cell-zero">—</span></td>` +
            `<td class="c"><span class="inv-cell-zero">—</span></td>` +
            `<td class="c group-sep">${sz.lastRestockDate ? escapeHtml(sz.lastRestockDate) : '<span class="inv-cell-zero">—</span>'}</td>` +
            // WAREHOUSE
            `<td class="c"><span class="inv-yn ${szWhAvail ? 'inv-yn-y' : 'inv-yn-n'}">${szWhAvail ? 'Y' : 'N'}</span></td>` +
            `<td class="c"><span class="inv-yn ${szOnOrder ? 'inv-yn-y' : 'inv-yn-n'}">${szOnOrder ? 'Y' : 'N'}</span></td>` +
            `<td class="c group-sep">${szEta || '<span class="inv-cell-zero">—</span>'}</td>` +
            // SALES
            `<td class="c">${szL30 > 0 ? `<span class="${szL30Cls}">${szL30}</span>` : '<span class="inv-cell-zero">0</span>'}</td>` +
            `<td class="c">${szL60 > 0 ? `<span class="${szL60Cls}">${szL60}</span>` : '<span class="inv-cell-zero">0</span>'}</td>` +
            `<td class="c group-sep">${szAvgWk > 0 ? (szAvgWk % 1 === 0 ? szAvgWk : szAvgWk.toFixed(1)) : '<span class="inv-cell-zero">0</span>'}</td>` +
            // OTHER — per-size Store Options: warehouse + up to 4 donor stores
            `<td class="c l inv-sizes-cell">${invSizeStoreOptionsHtml(p, sz)}</td>` +
          `</tr>`;
      });
    }
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;

  // Wire up sort: delegated click handler on the table's header row.
  // Re-attached on every render since we rebuild innerHTML.
  const headers = wrap.querySelectorAll('th.inv-sortable');
  headers.forEach(th => {
    th.addEventListener('click', function (e) {
      e.stopPropagation();
      const key = th.getAttribute('data-inv-sort');
      if (!key) return;
      if (invState.sortKey === key) {
        // Same column → toggle direction
        invState.sortDir = invState.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        // Different column → start ASC
        invState.sortKey = key;
        invState.sortDir = 'asc';
      }
      renderInventory();
    });
  });
}

function toggleInvExpand(parentName) {
  if (invState.expanded[parentName]) delete invState.expanded[parentName];
  else invState.expanded[parentName] = true;
  renderInventory();
}

function invUpdateSummary(total, oh, oos, killedCount) {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('inv-s-total',  total);
  set('inv-s-oh',     oh.toLocaleString());
  set('inv-s-oos',    oos);
  set('inv-s-killed', killedCount == null ? 0 : killedCount);
}

/**
 * Print — opens a popup window with a clean, printable version of the
 * CURRENT filtered inventory (respects pill, category, and search). Avoids
 * touching the dashboard layout. The user gets their browser's normal print
 * dialog and can save as PDF or send to a printer.
 */
function printInventory() {
  // Sync search input first
  const searchEl = document.getElementById('inv-search');
  if (searchEl) invState.searchQ = (searchEl.value || '').toLowerCase().trim();

  const filtered = invGetFilteredItems();
  if (!filtered.length) { alert('No products match the current filter — nothing to print.'); return; }

  // Build a compact header so the printed sheet identifies itself
  // Build a human-readable summary of the active filter set for the print header
  let filterLabel;
  if (invState.nbrActive) {
    filterLabel = 'Not Being Replenished';
  } else {
    const stockLabels = { oh: 'On Hand', transit: 'In Transit', oos: 'Out of Stock', low: 'Low Inventory' };
    const tagLabels   = { staple: 'Staple', seasonal: 'Seasonal', newLaunch: 'New Launch' };
    const parts = [];
    [...invState.stockStatusSet].forEach(k => parts.push(stockLabels[k] || k));
    [...invState.tagSet].forEach(k => parts.push(tagLabels[k] || k));
    filterLabel = parts.length ? parts.join(', ') : 'All Products';
  }
  const catLabel    = invState.catFilter === 'all' ? 'All Categories' : invState.catFilter;
  const searchLabel = invState.searchQ ? ' • Search: "' + invState.searchQ + '"' : '';

  // Build table rows (parent-only — size detail not printed to keep it readable)
  let rowsHtml = '';
  filtered.forEach(p => {
    const s = p.summary || {};
    const oh = s.totalOH || 0;
    const transit = s.totalInTransit || 0;
    const sizesOH = s.sizesOnHand || '—';
    const totalL30 = (p.sizes || []).reduce((sum, sz) => sum + (sz.l30 || 0), 0);
    const totalL60 = (p.sizes || []).reduce((sum, sz) => sum + (sz.l60 || 0), 0);
    const totalAvgWk = (p.sizes || []).reduce((sum, sz) => sum + (sz.avgWeeklySales || 0), 0);
    const whAvail = (p.sizes || []).some(sz => sz.warehouseAvailable);
    const onOrder = (p.sizes || []).some(sz => sz.onOrder);
    let lastRestock = '';
    (p.sizes || []).forEach(sz => {
      if (sz.lastRestockDate && (!lastRestock || sz.lastRestockDate > lastRestock)) lastRestock = sz.lastRestockDate;
    });
    let tag = '—';
    if (p.isNewLaunch) tag = 'NEW LAUNCH';
    else if (p.isStaple) tag = 'STAPLE';
    else if (p.isSeasonal) tag = 'SEASONAL';
    const broken = invIsBrokenSizeRun(p) ? ' (BROKEN)' : '';
    const storeOpt = whAvail ? 'Whse' : '—';

    rowsHtml += '<tr>' +
      '<td class="l">' + escapeHtml(p.productName || '') +
        '<div class="sub">' + escapeHtml(p.productType || '') + '</div></td>' +
      '<td class="c">' + oh + '</td>' +
      '<td class="c">' + transit + '</td>' +
      '<td class="c">' + escapeHtml(sizesOH) + escapeHtml(broken) + '</td>' +
      '<td class="c">' + tag + '</td>' +
      '<td class="c">' + escapeHtml(lastRestock || '—') + '</td>' +
      '<td class="c">' + (whAvail ? 'Y' : 'N') + '</td>' +
      '<td class="c">' + (onOrder ? 'Y' : 'N') + '</td>' +
      '<td class="c">' + totalL30 + '</td>' +
      '<td class="c">' + totalL60 + '</td>' +
      '<td class="c">' + (totalAvgWk > 0 ? (totalAvgWk % 1 === 0 ? totalAvgWk : totalAvgWk.toFixed(1)) : '0') + '</td>' +
      '<td class="c">' + escapeHtml(storeOpt || '—') + '</td>' +
    '</tr>';
  });

  // Open a popup window and write the print-ready document
  const printWin = window.open('', '_blank', 'width=1100,height=800');
  if (!printWin) { alert('Pop-up blocked — please allow pop-ups for this site and try again.'); return; }

  const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const storeLabel = activeStore || '';

  printWin.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Inventory — ${escapeHtml(storeLabel)} — ${escapeHtml(today)}</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #1a1d26; margin: 24px; }
  h1 { font-size: 16px; margin: 0 0 4px 0; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; }
  .meta { font-size: 11px; color: #555; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 9.5px; }
  thead th { background: #1a1d26; color: white; text-align: center; padding: 6px 4px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; }
  thead th.l { text-align: left; }
  tbody td { padding: 4px 6px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  tbody td.l { text-align: left; }
  tbody td.c { text-align: center; }
  tbody tr:nth-child(even) { background: #fafafa; }
  .sub { font-size: 8.5px; color: #666; margin-top: 1px; }
  @page { size: landscape; margin: 0.4in; }
  @media print { body { margin: 0; } .no-print { display: none; } }
</style></head><body>
<h1>Inventory Overview — ${escapeHtml(storeLabel)}</h1>
<div class="meta">Printed ${escapeHtml(today)} • Filter: ${escapeHtml(filterLabel)} • Category: ${escapeHtml(catLabel)}${escapeHtml(searchLabel)} • ${filtered.length} products</div>
<table>
  <thead>
    <tr>
      <th class="l">Product</th>
      <th>On-Hand</th>
      <th>In Transit</th>
      <th>Sizes Avail</th>
      <th>Tag</th>
      <th>Last Restock</th>
      <th>WH Avail</th>
      <th>On Order</th>
      <th>L30</th>
      <th>L60</th>
      <th>Avg Wk</th>
      <th>Also Available At</th>
    </tr>
  </thead>
  <tbody>${rowsHtml}</tbody>
</table>
<scr` + `ipt>window.onload = function () { setTimeout(function () { window.print(); }, 200); };</scr` + `ipt>
</body></html>`);
  printWin.document.close();
}

/**
 * CSV export — mirrors the Purge CSV style (semicolon-safe, BOM for Excel).
 * Honors the current filter: category, search, and pill all narrow the export
 * to what the user is actually looking at. Matches the table view.
 */
function exportInventoryCSV() {
  // Sync search input before computing filter (in case the user typed but
  // didn't tab out — input event has fired, but make sure invState is current)
  const searchEl = document.getElementById('inv-search');
  if (searchEl) invState.searchQ = (searchEl.value || '').toLowerCase().trim();

  const filtered = invGetFilteredItems();
  if (!filtered.length) { alert('No inventory data matches the current filter.'); return; }

  const headers = [
    'Parent Name','Product Type','Size',
    'On-Hand Inventory','In Transit','Sizes Available','Broken Size Run',
    'Last Restock Date',
    'Inventory Available','Inventory On Order','ETA',
    'Last 30 Days Sales','Last 60 Days Sales','Average Weekly Sales',
    'Also Available At',
    'Is Staple','Is New Launch','Is Seasonal'
  ];
  const rows = [headers];
  filtered.forEach(p => {
    const isStp = p.isStaple    ? 'Y' : 'N';
    const isNew = p.isNewLaunch ? 'Y' : 'N';
    const isSsn = p.isSeasonal  ? 'Y' : 'N';
    const broken = invIsBrokenSizeRun(p) ? 'Y' : 'N';
    // Compute parent-level last restock (most recent across sizes)
    let parentLastRestock = '';
    (p.sizes || []).forEach(sz => {
      if (sz.lastRestockDate && (!parentLastRestock || sz.lastRestockDate > parentLastRestock)) {
        parentLastRestock = sz.lastRestockDate;
      }
    });
    const sizesAvail = (p.summary && p.summary.sizesOnHand) || '';
    const storeOpt   = (p.sizes || []).some(sz => sz.warehouseAvailable) ? 'Whse' : '';
    (p.sizes || []).forEach(sz => {
      rows.push([
        p.productName || '', p.productType || '', sz.size || '',
        sz.oh || 0, sz.inTransit || 0, sizesAvail, broken,
        parentLastRestock,
        sz.warehouseAvailable ? 'Y' : 'N',
        sz.onOrder ? 'Y' : 'N',
        invFmtEta(sz.eta) || '',
        sz.l30 || 0, sz.l60 || 0, sz.avgWeeklySales || 0,
        storeOpt,
        isStp, isNew, isSsn
      ]);
    });
  });

  const csv = '﻿' + rows.map(r => r.map(c => {
    const s = String(c == null ? '' : c);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\r\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Inventory_Overview_' + (activeStore || 'store').replace(/[^a-zA-Z0-9]/g, '_') + '_' +
               new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

  loadStores();
  // Enter key submits from either login field
  ['login-store', 'login-password'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });
  });
});
</script>
